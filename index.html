<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FixIt - Campus Maintenance</title>

    <style>
        :root {
            --primary-color: #0A2540;
            --secondary-color: #00D2B4;
            --accent-color: #FF5A5F;
            --text-color: #333;
            --light-bg: #F8F9FA;
            --white: #FFFFFF;
            --shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--light-bg);
            color: var(--text-color);
        }

        /* HEADER */
        header {
            background-color: var(--white);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--shadow);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-placeholder {
            width: 50px;
            height: 50px;
            background-color: var(--primary-color);
            color: var(--secondary-color);
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            border-radius: 50%;
            font-size: 1.1rem;
        }

        .logo-text h1 {
            color: var(--primary-color);
            font-size: 1.5rem;
        }

        .logo-text p {
            color: #666;
            font-size: 0.85rem;
        }

        nav a {
            text-decoration: none;
            color: var(--primary-color);
            font-weight: 600;
            margin-left: 20px;
            transition: 0.3s;
        }

        nav a:hover {
            color: var(--secondary-color);
        }

        /* MAIN CONTAINER */
        .container {
            max-width: 1250px;
            margin: 2rem auto;
            padding: 0 2rem;
        }

        /* DASHBOARD */
        .dashboard-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: var(--white);
            padding: 1.5rem;
            border-radius: 10px;
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .stat-card h3 {
            color: #666;
            font-size: 0.9rem;
            margin-bottom: 5px;
        }

        .stat-card p {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--primary-color);
        }

        /* MAIN CONTENT */
        .main-content {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 30px;
            align-items: start;
        }

        .card {
            background: var(--white);
            padding: 2rem;
            border-radius: 10px;
            box-shadow: var(--shadow);
        }

        .card h2 {
            margin-bottom: 1.5rem;
            color: var(--primary-color);
            font-size: 1.4rem;
        }

        /* FORM */
        .form-group {
            margin-bottom: 1.3rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: var(--primary-color);
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 1rem;
            transition: 0.3s;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: var(--secondary-color);
        }

        .submit-btn {
            background-color: var(--primary-color);
            color: white;
            padding: 0.8rem 1.5rem;
            border: none;
            border-radius: 5px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: 0.3s;
        }

        .submit-btn:hover {
            background-color: #1A3E6D;
            transform: translateY(-2px);
        }

        /* SEARCH AND FILTER */
        .search-bar {
            margin-bottom: 1rem;
        }

        .filters {
            margin-bottom: 1rem;
        }

        /* TABLE */
        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }

        th,
        td {
            text-align: left;
            padding: 0.9rem;
            border-bottom: 1px solid #eee;
        }

        th {
            background-color: var(--light-bg);
            color: var(--primary-color);
            font-weight: 600;
        }

        tr:hover {
            background-color: #fafafa;
        }

        /* BADGES */
        .badge {
            display: inline-block;
            padding: 0.3rem 0.7rem;
            border-radius: 50px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .badge-pending {
            background-color: #FFF3CD;
            color: #856404;
        }

        .badge-progress {
            background-color: #CCE5FF;
            color: #004085;
        }

        .badge-resolved {
            background-color: #D4EDDA;
            color: #155724;
        }

        .badge-high {
            background-color: #F8D7DA;
            color: #721C24;
        }

        .badge-medium {
            background-color: #FFF3CD;
            color: #856404;
        }

        .badge-low {
            background-color: #D4EDDA;
            color: #155724;
        }

        /* DESCRIPTION */
        .description {
            font-size: 0.85rem;
            color: #666;
            max-width: 250px;
        }

        /* EMPTY MESSAGE */
        .empty-message {
            text-align: center;
            padding: 20px;
            color: #777;
        }

        /* SUCCESS MESSAGE */
        .success-message {
            display: none;
            background-color: #D4EDDA;
            color: #155724;
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 15px;
            text-align: center;
            font-weight: 600;
        }

        /* MOBILE */
        @media (max-width: 900px) {
            .main-content {
                grid-template-columns: 1fr;
            }

            header {
                flex-direction: column;
                gap: 15px;
            }

            nav a {
                margin: 0 8px;
            }
        }

        @media (max-width: 600px) {
            .container {
                padding: 0 1rem;
            }

            .card {
                padding: 1.2rem;
            }

            th,
            td {
                padding: 0.7rem;
                font-size: 0.85rem;
            }

            .description {
                min-width: 180px;
            }
        }
    </style>
</head>

<body>

<!-- HEADER -->
<header>

    <div class="logo-section">

        <div class="logo-placeholder">
            FixIt
        </div>

        <div class="logo-text">
            <h1>FixIt</h1>
            <p>Campus Maintenance</p>
        </div>

    </div>

    <nav>
        <a href="#dashboard">Dashboard</a>
        <a href="#complaints">Complaints</a>
        <a href="#submit">Submit Complaint</a>
    </nav>

</header>


<div class="container">

    <!-- DASHBOARD -->
    <section class="dashboard-stats" id="dashboard">

        <div class="stat-card">
            <div>
                <h3>Total Complaints</h3>
                <p id="totalCount">0</p>
            </div>
        </div>

        <div class="stat-card">
            <div>
                <h3>Pending</h3>
                <p id="pendingCount">0</p>
            </div>
        </div>

        <div class="stat-card">
            <div>
                <h3>In Progress</h3>
                <p id="progressCount">0</p>
            </div>
        </div>

        <div class="stat-card">
            <div>
                <h3>Resolved</h3>
                <p id="resolvedCount">0</p>
            </div>
        </div>

    </section>


    <!-- MAIN CONTENT -->
    <div class="main-content">

        <!-- SUBMIT COMPLAINT -->
        <section class="card" id="submit">

            <h2>Submit New Complaint</h2>

            <div class="success-message" id="successMessage">
                Complaint submitted successfully!
            </div>

            <form id="complaintForm">

                <!-- CATEGORY -->
                <div class="form-group">

                    <label for="category">
                        Problem Category
                    </label>

                    <select id="category" required>

                        <option value="">
                            Select a category
                        </option>

                        <option value="Electrical">
                            Electrical
                        </option>

                        <option value="Plumbing">
                            Plumbing
                        </option>

                        <option value="Furniture">
                            Furniture
                        </option>

                        <option value="Civil Maintenance">
                            Civil Maintenance
                        </option>

                        <option value="Cleaning">
                            Cleaning
                        </option>

                        <option value="Internet">
                            Internet / Wi-Fi
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>

                </div>


                <!-- LOCATION -->
                <div class="form-group">

                    <label for="location">
                        Problem Location
                    </label>

                    <input
                        type="text"
                        id="location"
                        placeholder="Example: Block A, Room 102"
                        required
                    >

                </div>


                <!-- PRIORITY -->
                <div class="form-group">

                    <label for="priority">
                        Priority
                    </label>

                    <select id="priority" required>

                        <option value="Low">
                            Low
                        </option>

                        <option value="Medium">
                            Medium
                        </option>

                        <option value="High">
                            High
                        </option>

                    </select>

                </div>


                <!-- DESCRIPTION -->
                <div class="form-group">

                    <label for="description">
                        Problem Description
                    </label>

                    <textarea
                        id="description"
                        rows="4"
                        placeholder="Describe the problem in detail"
                        required
                    ></textarea>

                </div>


                <!-- SUBMIT BUTTON -->
                <button
                    type="submit"
                    class="submit-btn"
                >
                    Submit Complaint
                </button>

            </form>

        </section>


        <!-- COMPLAINTS -->
        <section class="card" id="complaints">

            <h2>All Complaints</h2>

            <!-- SEARCH -->
            <div class="search-bar">

                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search by location, category or description..."
                >

            </div>


            <!-- STATUS FILTER -->
            <div class="filters">

                <select id="filterStatus">

                    <option value="all">
                        All Statuses
                    </option>

                    <option value="Pending">
                        Pending
                    </option>

                    <option value="In Progress">
                        In Progress
                    </option>

                    <option value="Resolved">
                        Resolved
                    </option>

                </select>

            </div>


            <!-- TABLE -->
            <div class="table-container">

                <table>

                    <thead>

                        <tr>

                            <th>Category</th>

                            <th>Location</th>

                            <th>Priority</th>

                            <th>Description</th>

                            <th>Status</th>

                        </tr>

                    </thead>

                    <tbody id="complaintTableBody">

                    </tbody>

                </table>

            </div>

            <div
                class="empty-message"
                id="emptyMessage"
            >
                No complaints found.
            </div>

        </section>

    </div>

</div>


<script>

    /*
    ==========================================
    FIXIT CAMPUS MAINTENANCE JAVASCRIPT
    ==========================================
    */


    // Store complaints
    let complaints = [

        {
            category: "Electrical",
            location: "Block A, Room 102",
            priority: "High",
            description: "Ceiling fan is not working.",
            status: "Pending"
        },

        {
            category: "Plumbing",
            location: "Block B, Second Floor Restroom",
            priority: "Medium",
            description: "Water tap is leaking.",
            status: "In Progress"
        },

        {
            category: "Furniture",
            location: "Block C, Room 205",
            priority: "Low",
            description: "One classroom chair is damaged.",
            status: "Resolved"
        }

    ];


    // Get HTML elements
    const complaintForm =
        document.getElementById("complaintForm");

    const tableBody =
        document.getElementById("complaintTableBody");

    const searchInput =
        document.getElementById("searchInput");

    const filterStatus =
        document.getElementById("filterStatus");

    const emptyMessage =
        document.getElementById("emptyMessage");

    const successMessage =
        document.getElementById("successMessage");


    /*
    ==========================================
    DISPLAY COMPLAINTS
    ==========================================
    */

    function displayComplaints() {

        tableBody.innerHTML = "";

        const searchText =
            searchInput.value.toLowerCase();

        const selectedStatus =
            filterStatus.value;


        const filteredComplaints =
            complaints.filter(function(complaint) {

                const matchesSearch =
                    complaint.category
                        .toLowerCase()
                        .includes(searchText)

                    ||

                    complaint.location
                        .toLowerCase()
                        .includes(searchText)

                    ||

                    complaint.description
                        .toLowerCase()
                        .includes(searchText);


                const matchesStatus =
                    selectedStatus === "all"
                    ||
                    complaint.status === selectedStatus;


                return matchesSearch && matchesStatus;

            });


        // Show empty message
        if (filteredComplaints.length === 0) {

            emptyMessage.style.display = "block";

        } else {

            emptyMessage.style.display = "none";

        }


        // Create table rows
        filteredComplaints.forEach(function(complaint) {

            const row =
                document.createElement("tr");


            // Priority badge
            let priorityClass = "";

            if (complaint.priority === "High") {

                priorityClass = "badge-high";

            } else if (complaint.priority === "Medium") {

                priorityClass = "badge-medium";

            } else {

                priorityClass = "badge-low";

            }


            // Status badge
            let statusClass = "";

            if (complaint.status === "Pending") {

                statusClass = "badge-pending";

            } else if (complaint.status === "In Progress") {

                statusClass = "badge-progress";

            } else {

                statusClass = "badge-resolved";

            }


            row.innerHTML = `

                <td>
                    ${complaint.category}
                </td>

                <td>
                    <strong>
                        ${complaint.location}
                    </strong>
                </td>

                <td>
                    <span class="badge ${priorityClass}">
                        ${complaint.priority}
                    </span>
                </td>

                <td class="description">
                    ${complaint.description}
                </td>

                <td>
                    <span class="badge ${statusClass}">
                        ${complaint.status}
                    </span>
                </td>

            `;


            tableBody.appendChild(row);

        });


        updateDashboard();

    }


    /*
    ==========================================
    UPDATE DASHBOARD COUNTS
    ==========================================
    */

    function updateDashboard() {

        const total =
            complaints.length;


        const pending =
            complaints.filter(function(complaint) {

                return complaint.status === "Pending";

            }).length;


        const progress =
            complaints.filter(function(complaint) {

                return complaint.status === "In Progress";

            }).length;


        const resolved =
            complaints.filter(function(complaint) {

                return complaint.status === "Resolved";

            }).length;


        document.getElementById("totalCount")
            .textContent = total;

        document.getElementById("pendingCount")
            .textContent = pending;

        document.getElementById("progressCount")
            .textContent = progress;

        document.getElementById("resolvedCount")
            .textContent = resolved;

    }


    /*
    ==========================================
    SUBMIT NEW COMPLAINT
    ==========================================
    */

    complaintForm.addEventListener(
        "submit",
        function(event) {

            event.preventDefault();


            // Get form values
            const category =
                document.getElementById("category").value;

            const location =
                document.getElementById("location").value;

            const priority =
                document.getElementById("priority").value;

            const description =
                document.getElementById("
